name: Deploy Klortho to Cloud Run (europe-west1)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      REGION: europe-west1
      REPO: apps
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_ID_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Artifact Registry auth
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build & Push container
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/${{ env.REPO }}/${{ secrets.SERVICE_NAME }}:${{ github.sha }}
        run: |
          echo "Building $IMAGE"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ secrets.SERVICE_NAME }} \
                     --region=${{ env.REGION }} \
                     --project=${{ secrets.GCP_PROJECT }} \
                     --image="${IMAGE}" \
                     --platform=managed  \
                     --allow-unauthenticated \
                     --port=8080 \
                     --memory=512Mi \
                     --max-instances=2 \
                     --concurrency=20 \
                     --set-env-vars=PLACK_ENV=production \
                     --ingress=all

      # Uncomment if/when you add Secret Manager entries like APP_ENV, APP_BASE_URL
      # - name: Set runtime secrets (optional)
      #   run: |
      #     gcloud run services update ${{ secrets.SERVICE_NAME }}       #       --region=${{ env.REGION }}       #       --project=${{ secrets.GCP_PROJECT }}       #       --set-secrets=APP_ENV=APP_ENV:latest,APP_BASE_URL=APP_BASE_URL:latest
